# Pilot model set for 2026-11-01. IDs read from the OpenRouter public catalog
# (GET https://openrouter.ai/api/v1/models) and the Gemini API docs on 2026-10-31.
# Re-check on run day: an ID that 404s must be replaced, and the README must record the IDs actually used.
# Prices are USD per 1M tokens (input/output) as listed on 2026-10-31.

[[models]]
label = "claude-opus-5.5"
provider = "openrouter"
model = "anthropic/claude-opus-5.5"      # $4 / $20
temperature = 1.0

[[models]]
label = "gpt-6.1-sol"
provider = "openrouter"
model = "openai/gpt-6.1-sol"             # $2 / $10
temperature = 1.0

[[models]]
label = "grok-4.7"
provider = "openrouter"
model = "x-ai/grok-4.7"                  # $2 / $6
temperature = 1.0

[[models]]
label = "deepseek-v4-pro-0813"
provider = "openrouter"
model = "deepseek/deepseek-v4-pro-0813"  # $0.115 / $4 (dated snapshot, not a ~latest alias)
temperature = 1.0

[[models]]
label = "gemini-4-argon"
provider = "gemini"                      # direct Gemini API, not OpenRouter
model = "gemini-4-argon"                 # $2 / $10 introductory until 2026-11-30, then $4 / $20
temperature = 1.0
extra = { generationConfig = { thinkingConfig = { thinkingLevel = "medium" } } }
