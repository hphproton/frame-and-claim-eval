# Gemini 4 Argon, direct Gemini API, reasoning effort high, no output-token limit.
# Calibration run on the new tasks. Pre-registered in docs/DECISIONS.tsv.
# Keys: the run command maps the environment's own variable onto the repo name, inline:
#   GEMINI_API_KEY="$GEMINI_API_KEY_EVAL" make run CONFIG=configs/calibration-gemini-20261108.toml ...
# Nothing writes a key to a file.
# Price table: Gemini 4 Argon introductory rates through 2026-11-30 (USD per 1M tokens), from the Gemini API
# pricing page as read on 2026-11-07 and recorded in results/pilot-gemini-api-20261107/report.md.
# It was not re-read on the run day; the trial cost in meta.json is an estimate from token counts.

session_budget_usd = 1.0

[[models]]
label = "gemini-4-argon"
provider = "gemini"
model = "gemini-4-argon"
temperature = 1.0
reasoning_effort = "high"
price_table = { input = 2.0, cached_input = 0.10, output = 10.0, read = "2026-11-07", valid_until = "2026-11-30", source = "Gemini API pricing page, Gemini 4 Argon introductory rates, as recorded in results/pilot-gemini-api-20261107/report.md" }
