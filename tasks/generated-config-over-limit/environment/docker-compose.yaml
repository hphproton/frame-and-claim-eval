# Harbor merges this over its base compose; the service name must be "main".
services:
  main:
    image: micro1eval/generated-config-over-limit:latest
    build:
      context: .
    cap_drop:
      - MKNOD
    networks:
      - upstream
    dns:
      - 172.30.28.53
    volumes:
      - ${TASK_SEED_DIR}:/run/task-seed

networks:
  upstream:
    external: true
    name: micro1eval-upstream
